<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>AI Production AP · Ohad Alfi</title>
    <!-- התקנה כאפליקציה (חלון נפרד, אייקון בשולחן העבודה) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AI Production" />
    <!-- סימן המותג OA — כמו באתר הסטודיו -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%23C8A6FF'/%3E%3Cstop offset='.5' stop-color='%237EE6E6'/%3E%3Cstop offset='1' stop-color='%23FFE8A3'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='%230A0A0B'/%3E%3Ctext x='50' y='70' font-family='Georgia,serif' font-style='italic' font-size='50' text-anchor='middle' fill='url(%23g)'%3EOA%3C/text%3E%3C/svg%3E" />
    <script>
      // מחיל את ערכת הצבעים השמורה לפני הציור הראשון — בלי הבזק של ערכה שגויה
      try {
        var t = localStorage.getItem('apos-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        var light = t === 'light' || (!t && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', light ? '#f6f5f9' : '#0a0a0b');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
