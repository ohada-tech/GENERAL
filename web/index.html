<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>AI Production AP · Ohad Alfi</title>
    <!-- התקנה כאפליקציה (חלון נפרד, אייקון בשולחן העבודה) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AI Production" />
    <!-- סימן המותג OA — כמו באתר oastudio.co.il -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <script>
      // מחיל את ערכת הצבעים השמורה לפני הציור הראשון — בלי הבזק של ערכה שגויה
      try {
        var t = localStorage.getItem('apos-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        var light = t === 'light' || (!t && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', light ? '#f6f5f9' : '#0a0a0b');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
